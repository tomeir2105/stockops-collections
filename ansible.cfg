# /home/user/stockops-collections/ansible.cfg
[defaults]
inventory = /home/user/stockops-collections/inventory.ini
collections_paths = /home/user/stockops-collections/ansible_collections:~/.ansible/collections:/usr/share/ansible/collections
retry_files_enabled = False
stdout_callback = default
result_format = yaml
host_key_checking = False
timeout = 30
deprecation_warnings = False

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

