- name: Coerce router_scripts_order when passed as a string (-e '["a","b"]')
  when:
    - router_scripts_order is defined
    - router_scripts_order is string
  ansible.builtin.set_fact:
    _override_list: "{{ router_scripts_order | from_yaml }}"

- name: Coerce router_scripts_order when passed as a list (inventory/group_vars)
  when:
    - router_scripts_order is defined
    - router_scripts_order is not string
  ansible.builtin.set_fact:
    _override_list: "{{ router_scripts_order | list }}"

- name: Default override to empty list when not provided
  when: _override_list is not defined
  ansible.builtin.set_fact:
    _override_list: []

- name: Compute runtime order (override wins, else list files from target dir)
  ansible.builtin.set_fact:
    _router_order: >-
      {{
        (_override_list | length > 0)
        | ternary(
            _override_list,
            lookup('ansible.builtin.pipe', "ls -1 " ~ router_scripts_dir ~ " | sort -V").splitlines()
          )
      }}

- name: Show planned execution order
  ansible.builtin.debug:
    var: _router_order

- name: Execute scripts in order (source /etc/stockops/vars.env)
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    [ -f /etc/stockops/vars.env ] && . /etc/stockops/vars.env || true
    exec bash "{{ router_scripts_dir }}/{{ item }}"
  args:
    executable: /bin/bash
  loop: "{{ _router_order }}"
  when: router_run_scripts | bool
